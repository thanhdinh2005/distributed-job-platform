spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backend}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}

  jpa:
    show-sql: true

server:
  port: ${APP_PORT:8081}

management:
  endpoint:
    health:
      show-details: always
